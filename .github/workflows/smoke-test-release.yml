name: Smoke-test release

# Manual only: downloads a published release DMG, installs the apps and checks
# they launch and stay running on each macOS version. Doesn't test the frame,
# Bluetooth, Photos, or Gatekeeper's first-launch prompt.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (blank = latest)
        required: false

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh release download ${{ inputs.tag }} --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir dl
          ls -l dl
      - name: Mount and install
        run: |
          hdiutil attach dl/*.dmg -mountpoint /Volumes/b8 -nobrowse -quiet
          # Whatever .app bundles the image holds (the names changed from
          # Blooming8* to Bloomin8* in 1.54, so don't hard-code them).
          : > apps.txt
          for app in /Volumes/b8/*.app; do
            name=$(basename "$app")
            cp -R "$app" /Applications/
            echo "$name" >> apps.txt
          done
          hdiutil detach /Volumes/b8 -quiet
          cat apps.txt
      - name: Check signature and architectures
        run: |
          while IFS= read -r name; do
            app="/Applications/$name"
            codesign --verify --strict "$app"
            exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            echo "$name: $(lipo -archs "$exe")"
            otool -L "$exe" | grep -v -E '/usr/lib|/System' | tail -n +2 || true
          done < apps.txt
      - name: Launch and confirm both stay running
        run: |
          sw_vers
          while IFS= read -r name; do
            app="/Applications/$name"
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            "$app/Contents/MacOS/$exe" > "$exe.log" 2>&1 &
          done < apps.txt
          sleep 25
          status=0
          while IFS= read -r name; do
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "/Applications/$name/Contents/Info.plist")
            if pgrep -x "$exe" >/dev/null; then echo "OK: $exe still running"; else echo "FAIL: $exe exited"; status=1; fi
            echo "--- $exe.log"; cat "$exe.log"
          done < apps.txt
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E "bloomin8|blooming8" || true
          exit $status
